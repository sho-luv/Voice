name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Lint shell scripts
        run: |
          bash -n install.sh
          bash -n build-app.sh
          bash -n engine/build.sh
          bash -n create-dmg.sh
          bash -n voice.sh

      - name: Validate plist
        run: plutil -lint Info.plist

      - name: Typecheck Swift app
        run: |
          mkdir -p /tmp/voice-module-cache
          swiftc -module-cache-path /tmp/voice-module-cache \
            -parse-as-library \
            -target arm64-apple-macos14.0 \
            -typecheck Voice.swift SpeechEngine.swift ModelDownload.swift Design/*.swift Views/*.swift Support/*.swift \
            -import-objc-header Voice-Bridging-Header.h \
            -I engine \
            -framework Cocoa \
            -framework ApplicationServices \
            -framework UserNotifications \
            -framework AVFoundation \
            -framework CoreAudio \
            -framework SwiftUI \
            -framework SceneKit
