name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Lint shell scripts
        run: |
          bash -n install.sh
          bash -n build-app.sh
          bash -n engine/build.sh
          bash -n create-dmg.sh
          bash -n voice.sh

      - name: Validate plist
        run: plutil -lint Info.plist

      - name: Typecheck Swift app
        run: |
          mkdir -p /tmp/voice-module-cache
          swiftc -module-cache-path /tmp/voice-module-cache \
            -parse-as-library \
            -typecheck Voice.swift SpeechEngine.swift \
            -import-objc-header Voice-Bridging-Header.h \
            -I engine \
            -framework Cocoa \
            -framework ApplicationServices \
            -framework UserNotifications \
            -framework AVFoundation \
            -framework CoreAudio
